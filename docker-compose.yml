# Base de datos PostgreSQL local para desarrollo y pruebas.
#   npm run db:up      → inicia el contenedor
#   npm run db:setup   → crea tablas y el usuario ADMIN
# En producción se usa Supabase (ver README).
services:
  db:
    image: postgres:16-alpine
    container_name: aiexpert-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiexpert
    ports:
      - "5433:5432"
    volumes:
      - aiexpert_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiexpert"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aiexpert_pgdata:
